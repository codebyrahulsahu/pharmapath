# PharmaPath — Deploy PWA (app/) to GitHub Pages
# Uses Node.js 24 based actions (no deprecation warnings):
#   checkout@v6 · configure-pages@v6 · upload-pages-artifact@v4 · deploy-pages@v5
#
# Setup (once):
#   Repo → Settings → Pages → Source: "GitHub Actions" (not branch)
#   Then push to main → app automatically goes live at
#   https://<username>.github.io/<repo>/   (installable PWA)

name: Deploy PharmaPath PWA to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload app/ as Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./app"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
