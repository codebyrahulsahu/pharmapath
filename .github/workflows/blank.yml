name: Deploy PharmaPath PWA to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages.
# Note: the Pages site must be created ONCE (Settings > Pages > Save) by the
# repository owner - the Actions GITHUB_TOKEN is not permitted to create Pages
# sites (see actions/configure-pages#40). After that, this workflow deploys
# automatically on every push to main.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload app/ as Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./app"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
