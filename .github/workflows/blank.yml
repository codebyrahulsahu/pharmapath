name: Validate PharmaPath PWA

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate static site
        shell: bash
        run: |
          set -euo pipefail

          required=(
            index.html
            app/index.html
            app/manifest.webmanifest
            app/sw.js
            app/icon-192.png
            app/icon-512.png
          )

          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing or empty required file: $file"; exit 1; }
          done

          python -m json.tool app/manifest.webmanifest >/dev/null
          grep -q 'url=app/' index.html
          grep -q 'href="app/"' index.html
          grep -q 'manifest.webmanifest' app/index.html
          grep -q 'navigator.serviceWorker' app/index.html

          echo "PharmaPath static site is ready for GitHub Pages."
