name: Pages probe (temporary)

on:
  push:
    branches: ["arena/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe the Pages API with GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          API="repos/${GITHUB_REPOSITORY}/pages"
          echo "--- GET $API ---"
          if body=$(gh api "$API" 2>/tmp/get.err); then
            printf '%s' "$body" | jq -c '{status, build_type, source, html_url}'
          else
            echo "GET FAILED: $(tr -d '\n' < /tmp/get.err | head -c 300)"
          fi
          echo "--- PUT build_type=workflow ---"
          if out=$(gh api --method PUT "$API" -f build_type=workflow 2>/tmp/put.err); then
            echo "PUT OK: $(printf '%s' "$out" | jq -c '{status, build_type, html_url}')"
          else
            echo "PUT FAILED: $(tr -d '\n' < /tmp/put.err | head -c 300)"
          fi
          echo "--- GET after ---"
          gh api "$API" --jq '{status, build_type, source}' 2>&1 | head -5
