<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PharmaPath — Interactive Prototype (B.Pharm Exam Companion)</title>
<style>
:root{
  --bg:#F4F8FC; --card:#FFFFFF; --ink:#16324F; --muted:#5A7590;
  --primary:#2E6FB7; --psoft:#E3EEF9; --accent:#4F9DDE;
  --gold:#9A7B1E; --gsoft:#FBF3DC; --ok:#2E8B6D; --oksoft:#E4F4EE;
  --bad:#B4442E; --badsoft:#FBE9E4; --border:#D9E5F0; --nav:#FFFFFF;
}
body.dark{
  --bg:#0E1B2C; --card:#16283F; --ink:#D7E6F5; --muted:#8FA9C4;
  --primary:#5B9BD5; --psoft:#1D3550; --accent:#6FB3EA;
  --gold:#D9B64E; --gsoft:#2A2A1C; --ok:#4CBF97; --oksoft:#12332A;
  --bad:#E07A5F; --badsoft:#3A211B; --border:#243B55; --nav:#13243A;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font:15px/1.6 'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;transition:background .3s,color .3s}
.app{max-width:760px;margin:0 auto;padding:0 14px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:1px solid var(--border);padding:12px 4px 10px;display:flex;align-items:center;gap:10px;backdrop-filter:blur(6px)}
.brand{font-weight:800;font-size:17px;color:var(--primary);letter-spacing:.2px;cursor:pointer;white-space:nowrap}
.brand small{display:block;font-size:9.5px;font-weight:600;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
.spacer{flex:1}
.tbtn{border:1px solid var(--border);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.tbtn.on{background:var(--primary);border-color:var(--primary);color:#fff}
.tbtn.small{padding:5px 10px;font-size:11.5px}
/* bottom nav */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:760px;background:var(--nav);border-top:1px solid var(--border);display:flex;z-index:40;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.nav button{flex:1;background:none;border:none;color:var(--muted);font-size:10.5px;font-weight:700;padding:6px 2px;cursor:pointer;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button .ic{font-size:19px;line-height:1}
.nav button.on{color:var(--primary)}
.nav button.on .ic{filter:drop-shadow(0 1px 2px rgba(46,111,183,.4))}
/* generic */
h2{font-size:21px;margin:6px 0 2px}
h3{font-size:16px;margin:14px 0 6px;color:var(--primary)}
.sub{color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin:10px 0;cursor:pointer;transition:transform .12s,box-shadow .12s}
.card:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(46,111,183,.10)}
.card:active{transform:scale(.985)}
.card h4{font-size:14.5px;margin-bottom:2px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
@media(max-width:520px){.grid{grid-template-columns:repeat(2,1fr)}}
.semcard{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 8px;text-align:center;cursor:pointer}
.semcard .n{font-size:20px;font-weight:800;color:var(--primary)}
.semcard .t{font-size:10.5px;color:var(--muted);font-weight:600}
.semcard.cur{border-color:var(--primary);background:var(--psoft)}
.bar{height:4px;background:var(--psoft);border-radius:99px;margin:7px 10px 0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--primary);border-radius:99px}
.pill{display:inline-block;background:var(--psoft);color:var(--primary);border-radius:999px;padding:2px 10px;font-size:11px;font-weight:700;margin:2px 4px 2px 0}
.pill.gold{background:var(--gsoft);color:var(--gold)}
.pill.ok{background:var(--oksoft);color:var(--ok)}
.pill.bad{background:var(--badsoft);color:var(--bad)}
.pill.ghost{background:transparent;border:1px dashed var(--border);color:var(--muted)}
.btn{display:inline-block;background:var(--primary);color:#fff;border:none;border-radius:10px;padding:11px 18px;font-size:14px;font-weight:800;cursor:pointer;text-align:center}
.btn.ghost{background:var(--card);color:var(--primary);border:1.5px solid var(--primary)}
.btn.gold{background:var(--gold);color:#fff}
.btn.block{display:block;width:100%;margin:8px 0}
.btn.small{padding:7px 13px;font-size:12.5px;border-radius:9px}
input[type=text],select{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:11px;font-size:14.5px;background:var(--card);color:var(--ink);outline:none}
input:focus,select:focus{border-color:var(--primary)}
.searchwrap{position:relative}
.searchwrap input{padding-left:38px}
.searchwrap .sic{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:16px;color:var(--muted)}
.banner{background:linear-gradient(120deg,#2E6FB7,#4F9DDE);color:#fff;border-radius:14px;padding:14px 16px;margin:12px 0;display:flex;align-items:center;gap:12px}
.banner.gold{background:linear-gradient(120deg,#8A6D1A,#B8952E)}
.banner .bt{font-weight:800;font-size:14px}
.banner .bs{font-size:12px;opacity:.9}
.row{display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:none}
.row .ic{font-size:20px;width:34px;text-align:center}
.row .grow{flex:1;min-width:0}
.row .grow b{display:block;font-size:14px}
.row .grow span{font-size:12px;color:var(--muted)}
.back{background:none;border:none;font-size:20px;cursor:pointer;color:var(--ink);padding:2px 8px 2px 0}
/* note screen */
.point{display:flex;gap:10px;background:var(--card);border:1px solid var(--border);border-left:4px solid var(--primary);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:14.8px;line-height:1.62}
.point .no{font-weight:800;color:var(--primary);font-size:12.5px;padding-top:2px}
.stepbox{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin:8px 0;position:relative}
.stepbox .sn{position:absolute;top:-9px;left:12px;background:var(--primary);color:#fff;font-size:10.5px;font-weight:800;border-radius:99px;padding:1px 9px}
.stepbox b{display:block;font-size:14px}
.stepbox span{font-size:12.5px;color:var(--muted)}
.arrowdown{text-align:center;color:var(--accent);font-size:16px;margin:-2px 0}
.lock{filter:blur(3.5px);pointer-events:none;user-select:none;opacity:.55}
.lockwrap{position:relative}
.lockbadge{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:rgba(244,248,252,.55);border-radius:12px;z-index:5}
body.dark .lockbadge{background:rgba(14,27,44,.55)}
/* scanner */
.drop{background:var(--card);border:2px dashed var(--accent);border-radius:14px;padding:26px 16px;text-align:center;cursor:pointer;margin:12px 0}
.drop .ic{font-size:34px}
.drop b{display:block;margin:6px 0 2px}
.itemrow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin:7px 0}
.itemrow input{width:18px;height:18px;accent-color:var(--primary);cursor:pointer}
.itemrow .st{margin-left:auto;font-size:11px;font-weight:800}
.strict{background:var(--gsoft);border:1px solid #E8D9A8;color:var(--gold);border-radius:10px;padding:10px 12px;font-size:12.8px;font-weight:700;margin:10px 0}
body.dark .strict{border-color:#5A4E24}
.checkbadge{background:var(--oksoft);border:1px solid #BFE3D6;color:var(--ok);border-radius:10px;padding:9px 12px;font-size:12.8px;font-weight:700;margin:8px 0}
body.dark .checkbadge{border-color:#2E5B4A}
/* profile rows */
.setrow{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--border)}
.setrow .grow{flex:1}
.setrow .grow b{font-size:14px}
.setrow .grow span{font-size:12px;color:var(--muted)}
.switch{width:46px;height:26px;border-radius:99px;background:var(--border);position:relative;cursor:pointer;transition:background .2s;flex-shrink:0}
.switch:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch.on{background:var(--primary)}
.switch.on:after{left:23px}
.resulthit{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin:7px 0;cursor:pointer}
.resulthit b{font-size:14px;display:block}
.resulthit span{font-size:12px;color:var(--muted)}
.flashcard{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:30px 22px;text-align:center;min-height:150px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;cursor:pointer;margin:12px 0}
.sectiontitle{font-size:12px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin:18px 0 4px}
.sampleimg{border:1px solid var(--border);border-radius:10px;overflow:hidden;background:#fff}
.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}
.note{font-size:12px;color:var(--muted);margin-top:2px}
.bigtitle{font-size:22px;font-weight:800;margin:8px 0 2px}
</style>

function subTab(t){

  const pyq=PYQS[c.name]||[];
  let html='';
  if(t==='units'){
    html=units.map(u=>`
      <div class="sectiontitle">Unit ${u}</div>
      ${subNotes.filter(([,n])=>n.unit===u).map(([title,n])=>`
      <div class="card" onclick="go('note',{t:'${title.replace(/'/g,"\\'")}'})">

          <span style="font-size:18px">${n.type==='drug'?'💊':n.type==='flowchart'?'🧩':'📘'}</span>

          <span class="sub">${n.marks} marks · ${n.en.length} points · ${n.flow?'⭐ flowchart':''}</span></div>
        </div>
      </div>`).join('')}
      ${units.length?`<div class="lockwrap"><div class="card"><h4>🔒 ${c.name} — Unit-wise deep notes (premium)</h4><span class="sub">Solved 10-mark answers + diagrams + mnemonics</span></div>
      <div class="lockbadge"><b>💎 Premium content</b><button class="btn gold small" onclick="go('vault')">Unlock</button></div></div>`:''}`).join('');
    if(!units.length)html=`<div class="card"><h4>📖 Notes is semester par jald aa rahe hain</h4><span class="sub">Meanwhile: Scanner se apna syllabus upload karke notes banao — instant!</span></div>`;
  }else if(t==='qs'){
    html=pyq.map(q=>`<div class="card" onclick="${q.note?`go('note',{t:'${q.note.replace(/'/g,"\\'")}'})`:''}">
      <h4>📝 ${q.q}</h4><span class="sub">RUHS ${q.y} · ${q.m} marks ${q.note?'· ✅ solved answer':''}</span></div>`).join('')||
    `<div class="card"><h4>Questions is subject mein add ho rahe hain</h4><span class="sub">Scanner se apna question paper scan karo — turant answers milenge</span></div>`;
  }else if(t==='pyq'){
    html=pyq.map(q=>`<div class="card ${q.note?'':'lockwrap'}" ${q.note?`onclick="go('note',{t:'${q.note.replace(/'/g,"\\'")}'})"`:''}>

  }else{
    html=`<div class="flashcard" onclick="fcFlip()"><div id="fcface">${L(FLASHCARDS[0].f[0],FLASHCARDS[0].f[1])}</div></div>
    <div style="text-align:center"><span class="sub">Card 1/${FLASHCARDS.length} · tap to flip · swipe = next</span></div>

      <button class="btn small" style="flex:1" onclick="fcNext()">😊 Got it</button>
    </div>`;
    S.fcIdx=0;S.fcFlip=false;
  }
  el('subtab').innerHTML=`<div class="fade">${html}</div>`;
}

function sf(f){const q=el('q').value;S.filter=f;doSearch(q)}
function doSearch(q){
  q=(q||'').toLowerCase().trim();
  const box=el('sres');
  if(!q){box.innerHTML=`<div class="sectiontitle">Popular</div>
    <div class="resulthit" onclick="go('note',{t:'Tetracycline — Mechanism of Action'})"><b>💊 Tetracycline — MOA</b><span>Pharmacology II · Sem 5 · 10 marks</span></div>
    <div class="resulthit" onclick="go('note',{t:'Malaria — Plasmodium Life Cycle (Etiology)'})"><b>🦠 Malaria — Life cycle</b><span>Pharmacology II · Sem 5</span></div>
    <div class="resulthit" onclick="go('note',{t:'Gene Transfer Techniques — Introduction'})"><b>🧫 Gene transfer techniques</b><span>Pharmaceutical Biotechnology · Sem 6</span></div>
    <div class="resulthit" onclick="go('note',{t:'Ayurvedic Formulations — Asava & Arishta'})"><b>🌿 Asava & Arishta</b><span>Pharmacognosy II · Sem 5</span></div>`;return}
  const hits=[];
  Object.keys(NOTES).forEach(t=>{if(t.toLowerCase().includes(q))hits.push({t,kind:'note'})});
  DRUGLIB.forEach(d=>{if(d.toLowerCase().includes(q))hits.push({t:d,kind:'drug'})});
  Object.entries(PYQS).forEach(([sub,list])=>list.forEach(qq=>{if(qq.q.toLowerCase().includes(q))hits.push({t:qq.q,kind:'q',y:qq.y,m:qq.m,note:qq.note})}));
  SEMS.forEach(s=>s.subs.forEach(x=>{if(x[0].toLowerCase().includes(q))hits.push({t:x[0],kind:'sub',sem:s.n})}));
  box.innerHTML=hits.length?hits.map(h=>{
    if(h.kind==='note')return `<div class="resulthit" onclick="go('note',{t:'${h.t.replace(/'/g,"\\'")}'})"><b>📘 ${h.t}</b><span>${NOTES[h.t].sub} · Sem ${NOTES[h.t].sem}</span></div>`;
    if(h.kind==='drug')return `<div class="resulthit" onclick="go('note',{t:'${h.t} — Mechanism of Action'})"><b>💊 ${h.t}</b><span>Drug library · 50+ monographs</span></div>`;
    if(h.kind==='q')return `<div class="resulthit" ${h.note?`onclick="go('note',{t:'${h.note.replace(/'/g,"\\'")}'})"`:''}><b>📝 ${h.t}</b><span>RUHS ${h.y} · ${h.m} marks${h.note?' · ✅ solved':''}</span></div>`;
    return `<div class="resulthit" onclick="go('subject',{sem:${h.sem},name:'${h.t.replace(/'/g,"\\'")}'})"><b>📚 ${h.t}</b><span>Semester ${h.sem}</span></div>`;
  }).join(''):`<div class="card"><h4>Kuch nahi mila 🤔</h4><span class="sub">Try: apna syllabus screenshot scan karo — jo image mein hoga, wahi milega.</span>
    <button class="btn small block" onclick="go('scanner')">📷 Scan my syllabus</button></div>`;
}

  },1100);
}
function openNote(name){
  if(name==='Tetracycline')go('note',{t:'Tetracycline — Mechanism of Action',back:'scanner'});
